[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-agent"
version = "0.1.0"
description = "A privacy-first local vector and graph retrieval agent powered by Ollama."
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
rag-agent = "rag_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
